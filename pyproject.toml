[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optosigma-gsc02c"
version = "0.1.1"
description = "Commented Python driver for the OptoSigma GSC-02C"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
